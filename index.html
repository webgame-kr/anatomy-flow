<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nurse Flow 3D Sandbox</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 라이브러리 버전 고정: three@0.160.0 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <h1>NURSE FLOW 3D <span class="ver">STEP 01 · Engine Sandbox</span></h1>
    <div class="top-actions">
      <button id="btn-camera" type="button">카메라 원위치</button>
      <button id="btn-reset" type="button" class="primary" disabled>전체 초기화</button>
    </div>
  </header>

  <main class="layout">
    <section id="viewport" class="viewport" aria-label="3D 화면">
      <div id="hud" class="hud">드래그: 회전 · 휠: 확대/축소 · 오른쪽 드래그: 이동 · 클릭: 선택</div>
      <div id="fatal" class="fatal" hidden></div>
    </section>

    <aside class="panel" aria-label="개발자 패널">
      <section>
        <h2>엔진 상태</h2>
        <dl class="kv">
          <dt>Python</dt><dd><span id="py-dot" class="dot loading"></span><span id="py-status">대기</span></dd>
          <dt>렌더러</dt><dd id="gl-info">-</dd>
          <dt>FPS</dt><dd id="fps">-</dd>
          <dt>그리기</dt><dd id="render-info">-</dd>
          <dt>객체 수</dt><dd id="obj-count">-</dd>
        </dl>
      </section>

      <section>
        <h2>Scene 객체</h2>
        <ul id="obj-list" class="obj-list"></ul>
      </section>

      <section>
        <h2>선택한 객체</h2>
        <dl class="kv" id="sel-info">
          <dt>ID</dt><dd id="sel-id">(없음)</dd>
          <dt>위치 x,y,z</dt><dd id="sel-pos">-</dd>
          <dt>회전(도)</dt><dd id="sel-rot">-</dd>
          <dt>크기·색</dt><dd id="sel-look">-</dd>
        </dl>
      </section>

      <section class="controls">
        <h2>Python 명령 테스트</h2>
        <div class="row">
          <span class="label">생성</span>
          <button type="button" data-create="box" class="py">정육면체</button>
          <button type="button" data-create="sphere" class="py">구체</button>
          <button type="button" data-create="cylinder" class="py">원통</button>
        </div>
        <div class="row">
          <span class="label">이동</span>
          <button type="button" data-move="-1,0,0" class="py sel">X−</button>
          <button type="button" data-move="1,0,0" class="py sel">X+</button>
          <button type="button" data-move="0,1,0" class="py sel">Y+</button>
          <button type="button" data-move="0,-1,0" class="py sel">Y−</button>
          <button type="button" data-move="0,0,-1" class="py sel">Z−</button>
          <button type="button" data-move="0,0,1" class="py sel">Z+</button>
        </div>
        <div class="row">
          <span class="label">모양</span>
          <button type="button" id="btn-rotate" class="py sel">회전 45°</button>
          <button type="button" id="btn-bigger" class="py sel">크게</button>
          <button type="button" id="btn-smaller" class="py sel">작게</button>
          <button type="button" id="btn-visible" class="py sel">보이기/숨기기</button>
        </div>
        <div class="row">
          <span class="label">색상</span>
          <input id="color-input" type="color" value="#2f6fde" aria-label="색상 선택">
          <button type="button" id="btn-color" class="py sel">적용</button>
          <button type="button" id="btn-next-color" class="py sel">다음 색</button>
        </div>
        <div class="row">
          <span class="label">기타</span>
          <button type="button" id="btn-remove" class="py sel danger">선택 제거</button>
          <button type="button" id="btn-circle" class="py">원형 배치</button>
          <button type="button" id="btn-ping" class="py">Python 핑</button>
        </div>
      </section>

      <section>
        <h2>이벤트 로그</h2>
        <ol id="log" class="log" reversed></ol>
      </section>
    </aside>
  </main>

  <!-- 모듈(Three.js)을 불러오지 못하면 안내한다 -->
  <script>
    setTimeout(function () {
      if (window.__nf3dBooted) return;
      var box = document.getElementById('fatal');
      box.hidden = false;
      box.innerHTML = '<h2>3D 엔진을 불러오지 못했습니다</h2><p>Three.js(cdn.jsdelivr.net)를 내려받지 못했거나 브라우저가 ES 모듈을 지원하지 않습니다. 인터넷 연결을 확인하고 최신 Chrome, Edge, Safari, Firefox에서 열어 주세요. <code>file://</code>로 열었다면 로컬 서버(<code>python -m http.server</code>)를 사용하세요.</p>';
    }, 20000);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
